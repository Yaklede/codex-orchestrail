name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: git diff --exit-code -- plugins/orchestrail/scripts/orchestrail.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrail-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
